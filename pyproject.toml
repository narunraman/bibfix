[project]
name = "bibfix"
version = "0.3.0"
description = "Check and fix BibTeX against DBLP and Crossref; sync with Zotero."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "bibtexparser>=1.4.4,<2",
    "lxml>=5",
    # 1.2.0; later rebiber commits require bibtexparser 2, which conflicts with reffix
    "rebiber @ git+https://github.com/yuchenlin/rebiber.git@f5e7a2b4b4bac7c8b111c1b75080c1bcb5c8b08d",
    "reffix>=1.3.2,<2",
    "requests>=2.31",
]

[project.scripts]
bibfix = "bibfix.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
exclude = ["/.private", "/.private/**", "/dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/bibfix"]
